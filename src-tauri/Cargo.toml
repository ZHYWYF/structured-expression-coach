[package]
name = "structured-expression-coach"
version = "0.2.13"
description = "本地优先的结构化表达训练应用"
authors = ["言序"]
edition = "2021"

[lib]
name = "structured_expression_coach_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }
tauri-plugin-http = "2.5"
keyring = { version = "3.6", features = ["apple-native"] }
