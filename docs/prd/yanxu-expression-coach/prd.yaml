user_style_prefs:
  - avoid: 模拟数据与不可操作的展示功能
    prefer: 仅描述真实可用能力，所有入口必须有完整操作闭环
    raised: 2026-09-13
    context: 用户要求最终产品不得保留 Mock 数据或 Demo 占位
  - avoid: AI 返回内容因格式或引用校验被整份拦截
    prefer: 只要 AI 返回非空内容就展示，优先结构化，失败时提供可读原文
    raised: 2026-09-13
    context: 录音报告多次因严格校验无法查看
  - avoid: 模板化卡片堆叠与廉价渐变
    prefer: 专业编辑室风格，暖纸、深墨、朱砂、苔绿，克制且具有编辑感
    raised: 2026-09-13
    context: 用户确认的产品视觉方向

